# A production-like copy of the API for load testing: the same container image the Azure
# deployment runs, held to the same size as its Container Apps replica (0.5 CPU, 1 GiB),
# with SQL Server, RabbitMQ and Azurite beside it. The only difference from production is
# that the per-address sign-up and sign-in limits are lifted, because every simulated
# player comes from this one machine.
#
# Build the image first, then run (see docs/load-testing.md):
#   dotnet publish 3.BackendAPI/Game.Api -c Release -t:PublishContainer -p:ContainerRepository=card-arena-api -p:ContainerImageTags=loadtest -p:ContainerFamily=noble-chiseled-extra
#   docker compose -f loadtest/compose.yaml run --rm k6
#   docker compose -f loadtest/compose.yaml down -v

name: card-arena-loadtest

services:
  api:
    image: card-arena-api:loadtest
    cpus: 0.5
    mem_limit: 1g
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=GameDb;User Id=sa;Password=LoadTest-Only-Pass1;TrustServerCertificate=True
      ConnectionStrings__AzureBlobStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      Jwt__SigningKey: load-test-only-signing-key-that-is-long-enough
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      AntiCheat__RegistrationsPerHour: "100000"
      AntiCheat__SignInsPerMinute: "100000"
    ports:
      - "5005:8080"
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: LoadTest-Only-Pass1
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P LoadTest-Only-Pass1 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

  # k6 waits for /health/ready itself, because the API runs database migrations before it listens.
  k6:
    image: grafana/k6:2.3.0
    profiles: [tools]
    depends_on: [api]
    environment:
      BASE_URL: http://api:8080
      PROFILE: ${PROFILE:-load}
      BOSS_VUS: ${BOSS_VUS:-}
      DUEL_VUS: ${DUEL_VUS:-}
      RESULTS: /results
    volumes:
      - ./arena.js:/scripts/arena.js:ro
      - ./results:/results
    command: run --quiet /scripts/arena.js
