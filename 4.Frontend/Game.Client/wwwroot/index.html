<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game.Client</title>
    <base href="/" />
    <!-- Filled in by the deploy (infra/set-client-csp.py); empty means no browser telemetry. -->
    <meta name="telemetry-connection-string" content="" />
    <meta name="telemetry-api-origin" content="" />
    <!-- The API's origin, filled in by the deploy too, so js/wake.js can wake it while the game loads. -->
    <meta name="api-origin" content="" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Game.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/wake.js"></script>
    <script src="lib/applicationinsights/ai.3.4.5.gbl.min.js"></script>
    <script src="js/telemetry.js"></script>
    <script src="js/idle.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/files.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
