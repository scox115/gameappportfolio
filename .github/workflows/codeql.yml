name: CodeQL

# Static analysis of the C# code for security problems (injection, path traversal, weak crypto...).
# Results show under Security > Code scanning. Code scanning is free for public repositories; on a
# private one it needs GitHub Code Security, so the job is skipped while the repository is private.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # "none" analyzes the source without building it, so this job doesn't need the .NET SDK.
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
