name: Deploy to Azure

# Runs after CI passes on main, or by hand from the Actions tab. It does nothing until the
# one-time setup in docs/azure-deployment.md has set the AZURE_* repository variables.
#
# With staging set up (STAGING_ENABLED=true, see docs/adr/0026-staging-and-previews.md), each
# commit goes to staging first and reaches production only if staging deployed, passed its smoke
# test and served the game. Production reuses the image staging tested. Add required reviewers to
# the production environment in GitHub to approve each release by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Redeploy the infrastructure even if nothing in it changed
        type: boolean
        default: false
      skip-staging:
        description: Go straight to production (for an urgent fix when staging is broken)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      vars.AZURE_CLIENT_ID != '' && vars.STAGING_ENABLED == 'true' && inputs.skip-staging != true &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      full: ${{ inputs.full == true }}
    secrets: inherit

  production:
    needs: staging
    if: >-
      always() && vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      full: ${{ inputs.full == true }}
      build-image: ${{ needs.staging.result != 'success' }}
    secrets: inherit
