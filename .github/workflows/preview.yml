name: Pull request preview

# Puts each pull request's game client on its own address, such as
# https://<staging host>-42.eastus2.4.azurestaticapps.net for pull request 42, and comments the link
# on the pull request. Previews run on staging's Static Web App and call staging's API, so they need
# staging set up first (STAGING_ENABLED=true); API changes in the pull request reach staging only
# once merged. The preview is deleted when the pull request closes.
# See docs/adr/0026-staging-and-previews.md.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write        # sign in to Azure with OIDC
  pull-requests: write   # comment the preview's address

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  preview:
    # Not for forks or Dependabot, which get no access to Azure.
    if: >-
      vars.STAGING_ENABLED == 'true' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read staging's addresses
        id: infra
        run: bash infra/environment-outputs.sh "$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Build the client against staging's API
        run: |
          python3 infra/configure-client.py settings 4.Frontend/Game.Client/wwwroot "${{ steps.infra.outputs.api }}" "Preview of pull request #$PR"
          dotnet publish 4.Frontend/Game.Client/Game.Client.csproj -c Release -o out/client \
            -p:Version="0.0.$PR" -p:SourceRevisionId="${{ github.event.pull_request.head.sha }}"
          python3 infra/configure-client.py out/client/wwwroot "${{ steps.infra.outputs.api }}" "${{ steps.infra.outputs.avatars }}" "${{ steps.infra.outputs.telemetry }}"
        env:
          PR: ${{ github.event.pull_request.number }}

      - name: Get the Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "${{ steps.infra.outputs.swa }}" \
            --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      # On a pull request, the action deploys to that pull request's own environment and comments its address.
      - name: Deploy the preview
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: out/client/wwwroot
          skip_app_build: true
          skip_api_build: true

      - name: Summary
        run: |
          {
            echo "### 🔍 Preview of pull request #${{ github.event.pull_request.number }}"
            echo ""
            echo "- Game: ${{ steps.deploy.outputs.static_web_app_url }}"
            echo "- API: ${{ steps.infra.outputs.api }} (staging)"
          } >> "$GITHUB_STEP_SUMMARY"

  close:
    if: >-
      vars.STAGING_ENABLED == 'true' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get the Static Web App deployment token
        id: swa
        run: |
          swa=$(bash infra/environment-outputs.sh "$RESOURCE_GROUP" | sed -n 's/^swa=//p')
          token=$(az staticwebapp secrets list --name "$swa" \
            --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      # Free plans hold three previews at a time, so close each one when its pull request closes.
      - name: Delete the preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close
          app_location: out/client/wwwroot
