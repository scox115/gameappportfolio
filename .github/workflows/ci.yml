name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A real SQL Server, the engine the game runs on in Azure. Tests marked for it (the lobby, the outbox,
    # two API replicas and the migrations) run against it; the rest use the in-memory provider.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CI-only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CI-only-Passw0rd -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GamePortfolioSolution.slnx

      # Fails on any direct or transitive package with a published advisory (GitHub Advisory Database).
      - name: Check for vulnerable packages
        run: |
          dotnet list GamePortfolioSolution.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '.projects[] | .path as $project | .frameworks[]?
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]
            | "::error::\(.id) \(.resolvedVersion) (\([.vulnerabilities[]?.severity] | join(", "))) in \($project | split("/") | last)"' vulnerable.json \
            | sort -u | tee vulnerable.txt
          if [ -s vulnerable.txt ]; then exit 1; fi
          echo "No known vulnerable packages."

      - name: Build
        run: dotnet build GamePortfolioSolution.slnx --no-restore --configuration Release

      # The browser tests run in their own job below.
      - name: Test
        env:
          TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=CI-only-Passw0rd;TrustServerCertificate=True
        run: >
          dotnet test GamePortfolioSolution.slnx --no-build --configuration Release
          --filter "Category!=Browser"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx

  # The blue-green release script decides when players move to a new API revision, so it is tested
  # like code: against stand-ins for the az and curl commands.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Lint the deploy scripts
        run: shellcheck infra/blue-green.sh infra/environment-outputs.sh

      - name: Test the deploy scripts and restore drill logic
        run: python3 -m unittest discover --start-directory infra/tests --verbose

      - name: Build the restore drill's database reader
        run: dotnet build infra/restore-drill/drill-database.cs

  # Plays the game in Chromium: the published Blazor client against the real API
  # (in-memory database, no RabbitMQ), started by the tests themselves.
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build 5.Tests/Game.E2E.Tests --configuration Release

      # Lets publishing rebuild the WebAssembly runtime with only what the client uses, which roughly
      # halves its largest file (docs/adr/0031-faster-first-visit.md).
      - name: Install the WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Publish the client
        run: dotnet publish 4.Frontend/Game.Client --configuration Release --output client-publish

      # The browser version matches the Microsoft.Playwright package the tests were built with.
      - name: Install Chromium
        run: pwsh 5.Tests/Game.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Browser tests
        env:
          E2E_CLIENT_DIR: ${{ github.workspace }}/client-publish
          E2E_SCREENSHOTS_DIR: ${{ github.workspace }}/BrowserTestResults/screenshots
        run: >
          dotnet test 5.Tests/Game.E2E.Tests --no-build --configuration Release
          --logger "trx;LogFileName=browser-test-results.trx"
          --results-directory BrowserTestResults

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            BrowserTestResults/*.trx
            BrowserTestResults/screenshots/
