# Dependabot opens pull requests for outdated or vulnerable dependencies. CI runs on each one,
# and merging deploys as usual. Minor and patch updates are grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /1.Core/*
      - /2.Infrastructure/*
      - /3.BackendAPI/*
      - /4.Frontend/*
      - /5.Tests/*
      - /6.Aspire/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Test tooling only touches the test projects, so even major versions come as one PR.
      test-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
      # Aspire packages are released together. The AppHost's Sdk="Aspire.AppHost.Sdk/x.y.z" line
      # isn't a package reference, so bump it by hand to match when this PR arrives.
      aspire:
        patterns: ["Aspire.*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
        update-types: [minor, patch]
      everything-else:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
