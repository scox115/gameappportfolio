services:
  # Local Database Engine
  game-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: game-sql-server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # Azure Storage Emulator (Blob Storage)
  game-storage-emulator:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: game-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    # Append the skip API version flag right here:
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

  # Local Message Broker
  game-messaging:
    image: rabbitmq:3-management-alpine
    container_name: game-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq

volumes:
  sql_data:
  azurite_data:
  rabbit_data:
