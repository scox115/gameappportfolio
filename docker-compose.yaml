services:
  # Local Database Engine
  game-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: game-sql-server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # Azure Storage Emulator (Blob Storage)
  game-storage-emulator:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: game-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    # --location /data keeps blobs in the azurite_data volume so they survive container re-creation.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck

  # Local Message Broker
  game-messaging:
    image: rabbitmq:3-management-alpine
    container_name: game-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq

  # Free OpenTelemetry dashboard (traces, metrics, structured logs) at http://localhost:18888.
  # The API sends to it over OTLP on port 4317 (see OTEL_EXPORTER_OTLP_ENDPOINT in appsettings.Development.json).
  game-telemetry-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: game-aspire-dashboard
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  sql_data:
  azurite_data:
  rabbit_data:
